<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Rock Paper Scissors</title>
<link rel="stylesheet" href="../style.css">
<style>
.rps-picks{display:flex;gap:15px;justify-content:center;margin:25px 0}
.rps-pick{width:100px;height:100px;border-radius:50%;border:3px solid #444;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;transition:.2s}
.rps-pick:hover{border-color:#007BFF;transform:scale(1.1)}
.rps-pick.selected{border-color:#2ecc71;background:#2ecc7122}
.rps-result{text-align:center;font-size:24px;font-weight:bold;margin:20px 0;min-height:80px}
.rps-scoreboard{display:flex;gap:30px;justify-content:center;margin:15px 0}
.rps-scoreboard div{text-align:center}
.rps-scoreboard h4{margin:0;color:#aaa;font-size:13px}
.rps-scoreboard .val{font-size:28px;font-weight:bold}
</style>
</head>
<body>
<div class="container" style="max-width:500px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="link-btn" onclick="location.href='../tools'">Back</button>
<button class="link-btn" onclick="location.href='../'">Dashboard</button>
</div>
<h2 style="text-align:center">Rock Paper Scissors</h2>
<div class="rps-scoreboard">
<div><h4>YOU</h4><div class="val" id="rpsW" style="color:#2ecc71">0</div></div>
<div><h4>DRAWS</h4><div class="val" id="rpsD" style="color:#f1c40f">0</div></div>
<div><h4>COMPUTER</h4><div class="val" id="rpsL" style="color:#e74c3c">0</div></div>
</div>
<div style="display:flex;justify-content:center;gap:30px;align-items:center;margin:20px 0">
<div style="text-align:center;font-size:40px" id="rpsPlayer">?</div>
<div style="font-size:24px;color:#aaa">VS</div>
<div style="text-align:center;font-size:40px" id="rpsComp">?</div>
</div>
<div class="rps-picks">
<div class="rps-pick" onclick="rpsPlay('rock')">🪨</div>
<div class="rps-pick" onclick="rpsPlay('paper')">📄</div>
<div class="rps-pick" onclick="rpsPlay('scissors')">✂️</div>
</div>
<div class="rps-result" id="rpsResult"></div>
<p style="text-align:center;color:#aaa;font-size:13px" id="rpsLabels">Rock / Paper / Scissors</p>
</div>
<script>
const emojis={rock:"🪨",paper:"📄",scissors:"✂️"};
const labels={rock:"Rock",paper:"Paper",scissors:"Scissors"};
let w=0,d=0,l=0;
function rpsPlay(pick){
const choices=["rock","paper","scissors"];
const comp=choices[Math.floor(Math.random()*3)];
document.getElementById("rpsPlayer").textContent=emojis[pick];
document.getElementById("rpsComp").textContent=emojis[comp];
document.getElementById("rpsLabels").textContent=labels[pick]+" vs "+labels[comp];
let result="";
if(pick===comp){d++;result="Draw!";document.getElementById("rpsResult").style.color="#f1c40f";}
else if((pick==="rock"&&comp==="scissors")||(pick==="paper"&&comp==="rock")||(pick==="scissors"&&comp==="paper")){w++;result="You win!";document.getElementById("rpsResult").style.color="#2ecc71";}
else{l++;result="Computer wins!";document.getElementById("rpsResult").style.color="#e74c3c";}
document.getElementById("rpsResult").textContent=result;
document.getElementById("rpsW").textContent=w;
document.getElementById("rpsD").textContent=d;
document.getElementById("rpsL").textContent=l;
}
</script>
</body>
</html>
