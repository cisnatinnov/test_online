<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Hangman</title>
<link rel="stylesheet" href="../style.css">
<style>
.hangman-box{display:flex;gap:30px;align-items:flex-start;justify-content:center;flex-wrap:wrap;margin-top:15px}
.hangman-canvas{background:#1a1a2e;border-radius:12px;padding:15px}
.letter-grid{display:flex;flex-wrap:wrap;gap:6px;max-width:360px;margin-top:15px}
.letter-btn{width:38px;height:38px;border:2px solid #444;border-radius:6px;background:#2a2a3e;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.letter-btn:hover{border-color:#007BFF;color:#007BFF}
.letter-btn:disabled{opacity:.3;cursor:default;border-color:#333;color:#555}
.word-display{display:flex;gap:8px;justify-content:center;margin:20px 0}
.word-char{width:36px;height:44px;border-bottom:3px solid #007BFF;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:#fff;letter-spacing:2px}
.hint-text{color:#aaa;text-align:center;margin:10px 0;font-style:italic}
</style>
</head>
<body>
<div class="container" style="max-width:700px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="link-btn" onclick="location.href='../tools.html'">Back</button>
<button class="link-btn" onclick="location.href='../dashboard.html'">Dashboard</button>
</div>
<h2 style="text-align:center">Hangman</h2>
<div class="hangman-box">
<canvas id="hmCanvas" width="200" height="250" class="hangman-canvas"></canvas>
</div>
<div class="word-display" id="wordDisplay"></div>
<div class="hint-text" id="hintText"></div>
<div class="letter-grid" id="letterGrid"></div>
<div style="text-align:center;margin-top:15px">
<p id="hmStatus" style="font-size:18px;font-weight:bold"></p>
<button onclick="newGame()" style="margin-top:10px">New Game</button>
</div>
</div>
<script>
const words=[
{word:"JAVASCRIPT",hint:"Programming language for the web"},
{word:"DATABASE",hint:"Stores structured data"},
{word:"ALGORITHM",hint:"Step-by-step procedure to solve a problem"},
{word:"FUNCTION",hint:"Reusable block of code"},
{word:"VARIABLE",hint:"Named storage for data"},
{word:"LOOP",hint:"Repeats a block of code"},
{word:"ARRAY",hint:"Ordered collection of elements"},
{word:"BOOLEAN",hint:"True or false value"},
{word:"STRING",hint:"Sequence of characters"},
{word:"INTEGER",hint:"Whole number type"},
{word:"PYTHON",hint:"Snake-named programming language"},
{word:"COMPILER",hint:"Converts source code to machine code"},
{word:"SYNTAX",hint:"Rules for writing code"},
{word:"OBJECT",hint:"Instance of a class"},
{word:"NETWORK",hint:"Interconnected computers"},
{word:"BINARY",hint:"Base-2 number system"},
{word:"PIXEL",hint:"Smallest unit of a digital image"},
{word:"SERVER",hint:"Provides data to other computers"},
{word:"BROWSER",hint:"Software to access the web"},
{word:"KEYBOARD",hint:"Input device for typing"},
];
let word,guessed,wrongs,maxWrongs=6;
function newGame(){
const pick=words[Math.floor(Math.random()*words.length)];
word=pick.word;guessed=new Set();wrongs=0;
document.getElementById("hintText").textContent="Hint: "+pick.hint;
document.getElementById("hmStatus").textContent="";
renderWord();renderLetters();drawHangman();
}
function renderWord(){
const d=document.getElementById("wordDisplay");d.innerHTML="";
for(const c of word){
const s=document.createElement("div");s.className="word-char";
s.textContent=guessed.has(c)?c:"";d.appendChild(s);
}
}
function renderLetters(){
const g=document.getElementById("letterGrid");g.innerHTML="";
for(let i=65;i<=90;i++){
const c=String.fromCharCode(i);
const b=document.createElement("button");b.className="letter-btn";b.textContent=c;
b.disabled=guessed.has(c);
b.onclick=()=>guess(c);g.appendChild(b);
}
}
function guess(c){
guessed.add(c);
if(!word.includes(c)){wrongs++;drawHangman();}
renderWord();renderLetters();checkEnd();
}
function checkEnd(){
const won=[...word].every(c=>guessed.has(c));
const lost=wrongs>=maxWrongs;
if(won)document.getElementById("hmStatus").innerHTML="<span style='color:#2ecc71'>You won!</span>";
if(lost)document.getElementById("hmStatus").innerHTML="<span style='color:#e74c3c'>Game over! Word: "+word+"</span>";
if(won||lost){
document.querySelectorAll(".letter-btn").forEach(b=>b.disabled=true);
}
}
function drawHangman(){
const c=document.getElementById("hmCanvas"),ctx=c.getContext("2d");
ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle="#ccc";ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(20,230);ctx.lineTo(180,230);ctx.stroke();
ctx.beginPath();ctx.moveTo(60,230);ctx.lineTo(60,30);ctx.stroke();
ctx.beginPath();ctx.moveTo(60,30);ctx.lineTo(140,30);ctx.stroke();
ctx.beginPath();ctx.moveTo(140,30);ctx.lineTo(140,60);ctx.stroke();
if(wrongs>=1){ctx.beginPath();ctx.arc(140,80,20,0,Math.PI*2);ctx.stroke();}
if(wrongs>=2){ctx.beginPath();ctx.moveTo(140,100);ctx.lineTo(140,160);ctx.stroke();}
if(wrongs>=3){ctx.beginPath();ctx.moveTo(140,115);ctx.lineTo(115,145);ctx.stroke();}
if(wrongs>=4){ctx.beginPath();ctx.moveTo(140,115);ctx.lineTo(165,145);ctx.stroke();}
if(wrongs>=5){ctx.beginPath();ctx.moveTo(140,160);ctx.lineTo(120,200);ctx.stroke();}
if(wrongs>=6){ctx.beginPath();ctx.moveTo(140,160);ctx.lineTo(160,200);ctx.stroke();}
}
newGame();
</script>
</body>
</html>
