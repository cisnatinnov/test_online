<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Aim Trainer</title>
<link rel="stylesheet" href="../style.css">
<style>
#atCanvas{display:block;margin:0 auto;border:2px solid #444;border-radius:8px;background:#1a1a2e;cursor:crosshair}
.at-hud{display:flex;justify-content:space-between;margin:10px 0;font-size:18px}
</style>
</head>
<body>
<div class="container" style="max-width:600px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="link-btn" onclick="location.href='../tools.html'">Back</button>
<button class="link-btn" onclick="location.href='../dashboard.html'">Dashboard</button>
</div>
<h2 style="text-align:center">Aim Trainer</h2>
<div class="at-hud">
<span>Score: <strong id="atScore">0</strong></span>
<span>Hits: <strong id="atHits">0</strong></span>
<span>Misses: <strong id="atMiss">0</strong></span>
<span>Time: <strong id="atTime">30</strong>s</span>
</div>
<canvas id="atCanvas" width="550" height="400"></canvas>
<div style="text-align:center;margin-top:10px">
<button onclick="atStart()" id="atStartBtn">Start</button>
<p id="atFinal" style="font-size:20px;font-weight:bold;color:#2ecc71"></p>
<p style="color:#aaa;font-size:13px">Click the red targets as fast as you can!</p>
</div>
</div>
<script>
const canvas=document.getElementById("atCanvas"),ctx=canvas.getContext("2d");
let targets=[],score,hits,misses,timer,running=false,animId;
function E(id){return document.getElementById(id);}
function atStart(){
score=0;hits=0;misses=0;timer=30;running=true;targets=[];
E("atScore").textContent=0;E("atHits").textContent=0;E("atMiss").textContent=0;
E("atTime").textContent=30;E("atFinal").textContent="";
E("atStartBtn").disabled=true;
if(animId)cancelAnimationFrame(animId);
atSpawnLoop();atTimeLoop();atGameLoop();
}
canvas.addEventListener("click",e=>{
if(!running)return;
const rect=canvas.getBoundingClientRect();
const mx=(e.clientX-rect.left)*(canvas.width/rect.width);
const my=(e.clientY-rect.top)*(canvas.height/rect.height);
for(let i=targets.length-1;i>=0;i--){
const t=targets[i];
const dx=mx-t.x,dy=my-t.y;
if(dx*dx+dy*dy<=t.r*t.r){
score+=Math.round(10+t.r);
hits++;targets.splice(i,1);
E("atScore").textContent=score;E("atHits").textContent=hits;return;
}
}
misses++;E("atMiss").textContent=misses;
});
function atSpawnTarget(){
const r=15+Math.random()*25;
targets.push({x:r+Math.random()*(canvas.width-r*2),y:r+Math.random()*(canvas.height-r*2),r,life:60+Math.random()*40});
}
function atSpawnLoop(){if(!running)return;atSpawnTarget();setTimeout(atSpawnLoop,700-Math.min(score*2,500));}
function atTimeLoop(){if(!running)return;timer--;E("atTime").textContent=timer;
if(timer<=0){running=false;atEnd();return;}setTimeout(atTimeLoop,1000);}
function atGameLoop(){
if(!running)return;
ctx.clearRect(0,0,canvas.width,canvas.height);
for(let i=targets.length-1;i>=0;i--){
const t=targets[i];t.life--;
if(t.life<=0){targets.splice(i,1);continue;}
const alpha=Math.min(1,t.life/20);
ctx.globalAlpha=alpha;
ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fillStyle="#e74c3c";ctx.fill();
ctx.beginPath();ctx.arc(t.x,t.y,t.r*0.6,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
ctx.beginPath();ctx.arc(t.x,t.y,t.r*0.2,0,Math.PI*2);ctx.fillStyle="#e74c3c";ctx.fill();
ctx.globalAlpha=1;
}
animId=requestAnimationFrame(atGameLoop);
}
function atEnd(){
running=false;E("atStartBtn").disabled=false;
const acc=hits+misses>0?((hits/(hits+misses))*100).toFixed(1):0;
E("atFinal").innerHTML="Game Over! Score: "+score+" | Accuracy: "+acc+"%";
}
</script>
</body>
</html>
