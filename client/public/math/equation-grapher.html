<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Equation Grapher</title>
<link rel="stylesheet" href="../style.css">
<style>
#eqCanvas{display:block;margin:0 auto;border:2px solid #444;border-radius:8px;background:#fff}
.eq-controls{margin:15px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eq-controls input{flex:1;min-width:250px;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:15px}
.eq-legend{margin:10px 0;font-size:13px}
.eq-legend span{margin-right:15px;padding:2px 8px;border-radius:3px}
</style>
</head>
<body>
<div class="container" style="max-width:700px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="link-btn" onclick="location.href='../tools.html'">Back</button>
<button class="link-btn" onclick="location.href='../dashboard.html'">Dashboard</button>
</div>
<h2 style="text-align:center">Equation Grapher</h2>
<div class="eq-controls">
<input type="text" id="eqInput" placeholder="e.g. sin(x), x^2, 2*x+1, log(x)" value="sin(x)">
<button onclick="eqAdd()">Plot</button>
<button onclick="eqClear()" style="background:#e74c3c">Clear All</button>
</div>
<div class="eq-controls">
<label style="white-space:nowrap">X range:</label>
<input type="number" id="eqXMin" value="-10" style="width:70px;min-width:70px">
<span>to</span>
<input type="number" id="eqXMax" value="10" style="width:70px;min-width:70px">
<button onclick="eqDraw()">Redraw</button>
</div>
<div class="eq-legend" id="eqLegend"></div>
<canvas id="eqCanvas" width="660" height="500"></canvas>
<p style="color:#aaa;font-size:12px;text-align:center;margin-top:5px">Supports: x^2, sin(x), cos(x), tan(x), log(x), sqrt(x), abs(x), exp(x), pi, e. Use * for multiply.</p>
</div>
<script>
const eqColors=["#e74c3c","#3498db","#2ecc71","#f1c40f","#9b59b6","#e67e22","#1abc9c","#e91e63"];
let equations=[];
function E(id){return document.getElementById(id);}
function eqEval(expr,x){
try{
const safe=expr.replace(/\^/g,"**").replace(/pi/g,"Math.PI").replace(/e(?![a-z])/gi,"Math.E")
.replace(/sin/g,"Math.sin").replace(/cos/g,"Math.cos").replace(/tan/g,"Math.tan")
.replace(/log/g,"Math.log").replace(/sqrt/g,"Math.sqrt").replace(/abs/g,"Math.abs")
.replace(/exp/g,"Math.exp").replace(/asin/g,"Math.asin").replace(/acos/g,"Math.acos")
.replace(/atan/g,"Math.atan");
const fn=new Function("x","return "+safe);
const val=fn(x);
return isFinite(val)?val:null;
}catch(e){return null;}
}
function eqAdd(){
const expr=E("eqInput").value.trim();
if(!expr)return;
if(equations.length>=8)equations.shift();
equations.push({expr,color:eqColors[equations.length%eqColors.length]});
eqDraw();
}
function eqClear(){equations=[];eqDraw();}
function eqDraw(){
const canvas=E("eqCanvas"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const xMin=parseFloat(E("eqXMin").value)||-10;
const xMax=parseFloat(E("eqXMax").value)||10;
ctx.clearRect(0,0,W,H);
const toX=v=>(v-xMin)/(xMax-xMin)*W;
let yMin=-10,yMax=10;
const pts=[];
equations.forEach(eq=>{
for(let px=0;px<W;px+=2){
const x=xMin+(px/W)*(xMax-xMin);
const y=eqEval(eq.expr,x);
if(y!==null&&isFinite(y))pts.push({x,y,color:eq.color,px});
}
});
if(pts.length){
const ys=pts.map(p=>p.y);
yMin=Math.min(...ys)-1;yMax=Math.max(...ys)+1;
if(yMax-yMin<2){yMin-=1;yMax+=1;}
}
const toY=v=>H-((v-yMin)/(yMax-yMin))*H;
ctx.strokeStyle="#e0e0e0";ctx.lineWidth=1;
if(yMin<=0&&yMax>=0){const y0=toY(0);ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();}
if(xMin<=0&&xMax>=0){const x0=toX(0);ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(x0,H);ctx.stroke();}
ctx.fillStyle="#888";ctx.font="11px sans-serif";
for(let x=Math.ceil(xMin);x<=Math.floor(xMax);x++){
if(x===0)continue;
const px=toX(x);ctx.fillText(x,px+2,toY(0)+12);
}
for(let y=Math.ceil(yMin);y<=Math.floor(yMax);y++){
if(y===0)continue;
const py=toY(y);ctx.fillText(y,toX(0)+4,py-4);
}
equations.forEach(eq=>{
ctx.strokeStyle=eq.color;ctx.lineWidth=2.5;ctx.beginPath();
let started=false;
for(let px=0;px<W;px+=1){
const x=xMin+(px/W)*(xMax-xMin);
const y=eqEval(eq.expr,x);
if(y===null||!isFinite(y)||y<yMin-50||y>yMax+50){started=false;continue;}
const py=toY(y);
if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
}
ctx.stroke();
});
const leg=E("eqLegend");leg.innerHTML="";
equations.forEach(eq=>{leg.innerHTML+=`<span style="background:${eq.color}22;color:${eq.color};font-weight:bold">${eq.expr}</span>`;});
}
eqDraw();
</script>
</body>
</html>
