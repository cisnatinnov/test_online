<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Shapes - 2D & 3D</title>
<link rel="stylesheet" href="../style.css">
<style>
.shape-tabs{display:flex;gap:10px;margin:15px 0}
.shape-tabs button{flex:1}
.shape-tabs button.active{background:#007BFF;border-color:#007BFF}
.shape-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.shape-form label{font-size:13px;color:#aaa}
.shape-form input{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
.shape-canvas-wrap{display:flex;justify-content:center;margin:20px 0}
#shapeCanvas{background:#1a1a2e;border-radius:8px}
.shape-results{background:#f8f9fa;padding:15px;border-radius:8px;margin:15px 0}
.shape-results h4{margin:0 0 8px}
.shape-results p{margin:4px 0;font-size:14px}
</style>
</head>
<body>
<div class="container" style="max-width:600px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="link-btn" onclick="location.href='../tools.html'">Back</button>
<button class="link-btn" onclick="location.href='../dashboard.html'">Dashboard</button>
</div>
<h2 style="text-align:center">Shapes Calculator</h2>
<div class="shape-tabs">
<button class="active" onclick="switchTab('2d',this)">2D Shapes</button>
<button onclick="switchTab('3d',this)">3D Shapes</button>
</div>
<div id="tab2d">
<div class="shape-form" style="grid-template-columns:1fr">
<label>Shape</label>
<select id="s2dShape" onchange="s2dInputs()" style="padding:8px;border-radius:4px">
<option value="circle">Circle</option>
<option value="rectangle">Rectangle</option>
<option value="triangle">Triangle</option>
<option value="square">Square</option>
<option value="ellipse">Ellipse</option>
<option value="trapezoid">Trapezoid</option>
<option value="parallelogram">Parallelogram</option>
</select>
</div>
<div class="shape-form" id="s2dFields"></div>
<button onclick="calc2d()">Calculate</button>
</div>
<div id="tab3d" style="display:none">
<div class="shape-form" style="grid-template-columns:1fr">
<label>Shape</label>
<select id="s3dShape" onchange="s3dInputs()" style="padding:8px;border-radius:4px">
<option value="cube">Cube</option>
<option value="sphere">Sphere</option>
<option value="cylinder">Cylinder</option>
<option value="cone">Cone</option>
<option value="rectprism">Rectangular Prism</option>
<option value="pyramid">Square Pyramid</option>
<option value="torus">Torus</option>
</select>
</div>
<div class="shape-form" id="s3dFields"></div>
<button onclick="calc3d()">Calculate</button>
</div>
<div class="shape-canvas-wrap"><canvas id="shapeCanvas" width="300" height="250"></canvas></div>
<div class="shape-results" id="shapeResults"><h4>Results</h4><p style="color:#aaa">Select a shape and enter dimensions</p></div>
</div>
<script>
function E(id){return document.getElementById(id);}
function switchTab(tab,E){
document.querySelectorAll(".shape-tabs button").forEach(b=>b.classList.remove("active"));
E.classList.add("active");
E("tab2d").style.display=tab==="2d"?"":"none";
E("tab3d").style.display=tab==="3d"?"":"none";
}
function s2dInputs(){
const shape=E("s2dShape").value;
const fields={circle:"Radius",rectangle:"Width,Height",triangle:"Base,Height",square:"Side",ellipse:"Semi-major,Semi-minor",trapezoid:"Base1,Base2,Height",parallelogram:"Base,Height"};
const parts=fields[shape].split(",");
const d=E("s2dFields");d.innerHTML="";
parts.forEach((p,i)=>{d.innerHTML+=`<div><label>${p}</label><input type="number" id="s2d${i}" min="0" step="any"></div>`;});
}
function s3dInputs(){
const shape=E("s3dShape").value;
const fields={cube:"Side",sphere:"Radius",cylinder:"Radius,Height",cone:"Radius,Height",rectprism:"Length,Width,Height",pyramid:"Base,Height",torus:"R,r"};
const parts=fields[shape].split(",");
const d=E("s3dFields");d.innerHTML="";
parts.forEach((p,i)=>{d.innerHTML+=`<div><label>${p}</label><input type="number" id="s3d${i}" min="0" step="any"></div>`;});
}
function g(id){return parseFloat(E(id).value)||0;}
function drawCircle(r){
const c=E("shapeCanvas"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
ctx.beginPath();ctx.arc(150,125,r*2,0,Math.PI*2);ctx.strokeStyle="#007BFF";ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle="#007BFF22";ctx.fill();
}
function drawRect(w,h){
const c=E("shapeCanvas"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
const s=Math.min(240/w,200/h);ctx.strokeStyle="#007BFF";ctx.lineWidth=3;
ctx.strokeRect(150-w*s/2,125-h*s/2,w*s,h*s);
ctx.fillStyle="#007BFF22";ctx.fillRect(150-w*s/2,125-h*s/2,w*s,h*s);
}
function drawSphere(r){
const c=E("shapeCanvas"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
const R=Math.min(r*2,100);
ctx.beginPath();ctx.arc(150,125,R,0,Math.PI*2);ctx.strokeStyle="#007BFF";ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle="#007BFF22";ctx.fill();
ctx.beginPath();ctx.ellipse(150,125,R,R*0.3,0,0,Math.PI*2);ctx.strokeStyle="#007BFF88";ctx.stroke();
ctx.beginPath();ctx.ellipse(150,125,R*0.3,R,0,0,Math.PI*2);ctx.strokeStyle="#007BFF88";ctx.stroke();
}
function drawCyl(r,h){
const c=E("shapeCanvas"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
const s=Math.min(100/r,120/h);const rr=r*s,hh=h*s;
ctx.beginPath();ctx.ellipse(150,125-hh/2,rr,rr*0.3,0,0,Math.PI*2);ctx.strokeStyle="#007BFF";ctx.lineWidth=3;ctx.stroke();
ctx.beginPath();ctx.moveTo(150-rr,125-hh/2);ctx.lineTo(150-rr,125+hh/2);ctx.stroke();
ctx.beginPath();ctx.moveTo(150+rr,125-hh/2);ctx.lineTo(150+rr,125+hh/2);ctx.stroke();
ctx.beginPath();ctx.ellipse(150,125+hh/2,rr,rr*0.3,0,0,Math.PI);ctx.stroke();
}
function calc2d(){
const shape=E("s2dShape").value;let area,perim,formula="";
if(shape==="circle"){const r=g("s2d0");area=Math.PI*r*r;perim=2*Math.PI*r;formula="A=πr², P=2πr";drawCircle(r);}
else if(shape==="rectangle"){const w=g("s2d0"),h=g("s2d1");area=w*h;perim=2*(w+h);formula="A=wh, P=2(w+h)";drawRect(w,h);}
else if(shape==="triangle"){const b=g("s2d0"),h=g("s2d1");area=0.5*b*h;perim="-";formula="A=½bh";drawRect(b,h);}
else if(shape==="square"){const s=g("s2d0");area=s*s;perim=4*s;formula="A=s², P=4s";drawRect(s,s);}
else if(shape==="ellipse"){const a=g("s2d0"),b=g("s2d1");area=Math.PI*a*b;perim="≈"+(Math.PI*(3*(a+b)-Math.sqrt((3*a+b)*(a+3*b)))).toFixed(2);formula="A=πab";drawRect(a*2,b*2);}
else if(shape==="trapezoid"){const b1=g("s2d0"),b2=g("s2d1"),h=g("s2d2");area=0.5*(b1+b2)*h;perim="-";formula="A=½(a+b)h";drawRect(Math.max(b1,b2),h);}
else{const b=g("s2d0"),h=g("s2d1");area=b*h;perim="-";formula="A=bh";drawRect(b,h);}
E("shapeResults").innerHTML=`<h4>${shape.charAt(0).toUpperCase()+shape.slice(1)}</h4><p><strong>Formula:</strong> ${formula}</p><p><strong>Area:</strong> ${typeof area==="number"?area.toFixed(4):area}</p><p><strong>Perimeter:</strong> ${typeof perim==="number"?perim.toFixed(4):perim}</p>`;
}
function calc3d(){
const shape=E("s3dShape").value;let vol,surf,formula="";
if(shape==="cube"){const s=g("s3d0");vol=s*s*s;surf=6*s*s;formula="V=s³, SA=6s²";drawRect(s,s);}
else if(shape==="sphere"){const r=g("s3d0");vol=(4/3)*Math.PI*r*r*r;surf=4*Math.PI*r*r;formula="V=⁴⁄₃πr³, SA=4πr²";drawSphere(r);}
else if(shape==="cylinder"){const r=g("s3d0"),h=g("s3d1");vol=Math.PI*r*r*h;surf=2*Math.PI*r*(r+h);formula="V=πr²h, SA=2πr(r+h)";drawCyl(r,h);}
else if(shape==="cone"){const r=g("s3d0"),h=g("s3d1");const l=Math.sqrt(r*r+h*h);vol=(1/3)*Math.PI*r*r*h;surf=Math.PI*r*(r+l);formula="V=⅓πr²h, SA=πr(r+l)";drawCyl(r,h);}
else if(shape==="rectprism"){const l=g("s3d0"),w=g("s3d1"),h=g("s3d2");vol=l*w*h;surf=2*(l*w+l*h+w*h);formula="V=lwh, SA=2(lw+lh+wh)";drawRect(l,h);}
else if(shape==="pyramid"){const b=g("s3d0"),h=g("s3d1");const l=Math.sqrt((b/2)*(b/2)+h*h);vol=(1/3)*b*b*h;surf=b*b+2*b*l;formula="V=⅓b²h, SA=b²+2bl";drawRect(b,h);}
else{const R=g("s3d0"),r=g("s3d1");vol=2*Math.PI*Math.PI*R*r*r;surf=4*Math.PI*Math.PI*R*r;formula="V=2π²Rr², SA=4π²Rr";drawRect(R*2,R*2);}
E("shapeResults").innerHTML=`<h4>${shape==="rectprism"?"Rectangular Prism":shape.charAt(0).toUpperCase()+shape.slice(1)}</h4><p><strong>Formula:</strong> ${formula}</p><p><strong>Volume:</strong> ${typeof vol==="number"?vol.toFixed(4):vol}</p><p><strong>Surface Area:</strong> ${typeof surf==="number"?surf.toFixed(4):surf}</p>`;
}
s2dInputs();s3dInputs();
</script>
</body>
</html>
