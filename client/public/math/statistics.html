<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Statistics</title>
<link rel="stylesheet" href="../style.css">
<style>
.stat-input{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:15px;box-sizing:border-box;margin-bottom:10px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:15px 0}
.stat-card{background:#f8f9fa;padding:15px;border-radius:8px;text-align:center;border:1px solid #dee2e6}
.stat-card h4{margin:0 0 5px;font-size:12px;color:#666}
.stat-card .val{font-size:22px;font-weight:bold;color:#007BFF}
#statChart{display:block;margin:15px auto;border:1px solid #ddd;border-radius:8px;background:#fff}
.stat-ops{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stat-ops button{font-size:13px;padding:8px 12px}
</style>
</head>
<body>
<div class="container" style="max-width:650px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="link-btn" onclick="location.href='../tools.html'">Back</button>
<button class="link-btn" onclick="location.href='../dashboard.html'">Dashboard</button>
</div>
<h2 style="text-align:center">Statistics Calculator</h2>
<textarea id="statInput" class="stat-input" rows="3" placeholder="Enter numbers separated by commas, e.g. 12, 15, 18, 22, 25, 30"></textarea>
<div class="stat-ops">
<button onclick="statCalc()">Calculate</button>
<button onclick="statLoadExample()">Load Example</button>
<button onclick="statClear()" style="background:#e74c3c">Clear</button>
</div>
<div class="stat-grid" id="statCards"></div>
<h3>Distribution</h3>
<canvas id="statChart" width="600" height="250"></canvas>
<h3>Details</h3>
<div id="statDetails" style="background:#f8f9fa;padding:15px;border-radius:8px"></div>
</div>
<script>
function E(id){return document.getElementById(id);}
function statLoadExample(){E("statInput").value="12, 15, 18, 20, 22, 22, 25, 28, 30, 35, 40, 45, 50, 55, 60";}
function statClear(){E("statInput").value="";E("statCards").innerHTML="";E("statDetails").innerHTML="";E("statChart").getContext("2d").clearRect(0,0,600,250);}
function statCalc(){
const raw=E("statInput").value;
const nums=raw.split(/[,\s]+/).map(Number).filter(n=>isFinite(n));
if(nums.length<2)return alert("Enter at least 2 numbers!");
nums.sort((a,b)=>a-b);
const n=nums.length;
const sum=nums.reduce((a,b)=>a+b,0);
const mean=sum/n;
const sorted=nums;
const median=n%2===1?sorted[(n-1)/2]:(sorted[n/2-1]+sorted[n/2])/2;
const freq={};nums.forEach(v=>{freq[v]=(freq[v]||0)+1;});
let mode="-";let maxFreq=0;
for(const[k,v]of Object.entries(freq)){if(v>maxFreq){maxFreq=v;mode=k;}}
if(maxFreq===1)mode="No mode";
const variance=nums.reduce((s,v)=>s+(v-mean)**2,0)/n;
const stdDev=Math.sqrt(variance);
const range=sorted[n-1]-sorted[0];
const q1=sorted[Math.floor(n*0.25)];
const q3=sorted[Math.floor(n*0.75)];
const iqr=q3-q1;
const min=sorted[0],max=sorted[n-1];
E("statCards").innerHTML=`
<div class="stat-card"><h4>Count</h4><div class="val">${n}</div></div>
<div class="stat-card"><h4>Mean</h4><div class="val">${mean.toFixed(4)}</div></div>
<div class="stat-card"><h4>Median</h4><div class="val">${median}</div></div>
<div class="stat-card"><h4>Mode</h4><div class="val">${mode}</div></div>
<div class="stat-card"><h4>Std Dev</h4><div class="val">${stdDev.toFixed(4)}</div></div>
<div class="stat-card"><h4>Variance</h4><div class="val">${variance.toFixed(4)}</div></div>
<div class="stat-card"><h4>Range</h4><div class="val">${range}</div></div>
<div class="stat-card"><h4>Min</h4><div class="val">${min}</div></div>
<div class="stat-card"><h4>Max</h4><div class="val">${max}</div></div>`;
E("statDetails").innerHTML=`
<p><strong>Sum:</strong> ${sum}</p><p><strong>Q1 (25th):</strong> ${q1}</p>
<p><strong>Q3 (75th):</strong> ${q3}</p><p><strong>IQR:</strong> ${iqr}</p>
<p><strong>Lower Fence:</strong> ${q1-1.5*iqr}</p><p><strong>Upper Fence:</strong> ${q3+1.5*iqr}</p>`;
drawHist(nums);
}
function drawHist(nums){
const c=E("statChart"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height);
const min=Math.min(...nums),max=Math.max(...nums);
const bins=10;const binW=(max-min)/bins||1;
const counts=Array(bins).fill(0);
nums.forEach(v=>{let idx=Math.floor((v-min)/binW);if(idx>=bins)idx=bins-1;counts[idx]++;});
const maxC=Math.max(...counts);const barW=(c.width-60)/bins;
ctx.fillStyle="#ddd";
for(let i=0;i<=bins;i++){
const x=30+i*barW;
ctx.beginPath();ctx.moveTo(x,10);ctx.lineTo(x,c.height-30);ctx.strokeStyle="#eee";ctx.stroke();
}
const maxH=c.height-50;
counts.forEach((count,i)=>{
const h=maxC>0?(count/maxC)*maxH:0;
const x=30+i*barW+2;
ctx.fillStyle="#007BFF";ctx.fillRect(x,c.height-30-h,barW-4,h);
ctx.fillStyle="#333";ctx.font="11px sans-serif";ctx.textAlign="center";
const label=(min+i*binW).toFixed(1);
ctx.fillText(label,x+barW/2-2,c.height-15);
if(count>0){ctx.fillText(count,x+barW/2-2,c.height-35-h);}
});
}
</script>
</body>
</html>
