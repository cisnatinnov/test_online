<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Turtle Racing</title>
<link rel="stylesheet" href="../style.css">
<style>
#trCanvas{display:block;margin:0 auto;border:2px solid #444;border-radius:8px;background:#2d5a27}
.tr-info{display:flex;justify-content:center;gap:20px;margin:10px 0;font-size:16px}
.tr-track{margin:5px 0}
</style>
</head>
<body>
<div class="container" style="max-width:700px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="link-btn" onclick="location.href='../tools'">Back</button>
<button class="link-btn" onclick="location.href='../'">Dashboard</button>
</div>
<h2 style="text-align:center">Turtle Racing</h2>
<div class="tr-info">
<span>Balance: <strong id="trBal">100</strong> coins</span>
<span>Bet: <strong id="trBetDisplay">-</strong></span>
</div>
<div id="trTracks"></div>
<canvas id="trCanvas" width="660" height="220" style="display:none"></canvas>
<div style="text-align:center;margin-top:15px">
<div id="trPickPhase">
<p>Pick your turtle and place a bet:</p>
<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0" id="trTurtles"></div>
<div>
<label>Bet: <input type="number" id="trBetInput" min="1" max="100" value="10" style="width:70px;padding:5px;border-radius:4px;border:1px solid #ccc"></label>
<button onclick="trStart()" id="trGoBtn">Race!</button>
</div>
</div>
<div id="trResult" style="display:none;font-size:20px;font-weight:bold;margin:10px 0"></div>
<button onclick="trReset()" style="display:none" id="trAgainBtn">Race Again</button>
</div>
</div>
<script>
const colors=["#e74c3c","#3498db","#2ecc71","#f1c40f","#9b59b6","#e67e22"];
const names=["Red","Blue","Green","Yellow","Purple","Orange"];
let turtles,balance=100,selected,bet,running,positions,anim;
function trInit(){
turtles=colors.map((c,i)=>({color:c,name:names[i],speed:0.5+Math.random()*1.5}));
selected=-1;bet=10;running=false;positions=Array(6).fill(0);
E("trPickPhase").style.display="";E("trResult").style.display="none";
E("trAgainBtn").style.display="none";E("trCanvas").style.display="none";
E("trBetInput").value=10;
renderTurtleButtons();
}
function E(id){return document.getElementById(id);}
function renderTurtleButtons(){
const d=E("trTurtles");d.innerHTML="";
turtles.forEach((t,i)=>{
const b=document.createElement("button");
b.textContent=t.name;b.style.background=t.color;b.style.color="#fff";
b.style.border=selected===i?"3px solid #fff":"3px solid transparent";
b.onclick=()=>{selected=i;renderTurtleButtons();};d.appendChild(b);
});
}
function trStart(){
if(selected<0)return alert("Pick a turtle!");
bet=parseInt(E("trBetInput").value)||10;
if(bet<1||bet>balance)return alert("Invalid bet!");
E("trPickPhase").style.display="none";
E("trCanvas").style.display="block";
E("trBetDisplay").textContent=bet;
running=true;positions=Array(6).fill(0);
anim=requestAnimationFrame(trLoop);
}
function trLoop(){
if(!running)return;
const canvas=E("trCanvas"),ctx=canvas.getContext("2d");
ctx.clearRect(0,0,canvas.width,canvas.height);
const trackH=canvas.height/6;
for(let i=0;i<6;i++){
ctx.fillStyle="#1a3a15";ctx.fillRect(0,i*trackH,canvas.width,trackH);
ctx.fillStyle=turtles[i].color;
ctx.fillRect(positions[i]*5+5,i*trackH+trackH/2-10,30,20);
ctx.fillStyle="#fff";ctx.font="bold 11px sans-serif";ctx.textAlign="center";
ctx.fillText(turtles[i].name,positions[i]*5+20,i*trackH+trackH/2+4);
if(!running)continue;
positions[i]+=turtles[i].speed*(0.3+Math.random()*0.7);
if(positions[i]>=120){
running=false;
const win=i===selected;
balance+=win?bet*5:0;
E("trResult").textContent=win?"You won "+bet*5+" coins!":"Turtle "+turtles[i].name+" won!";
E("trResult").style.color=win?"#2ecc71":"#e74c3c";
E("trResult").style.display="";
E("trAgainBtn").style.display="";
E("trBal").textContent=balance;
E("trBetDisplay").textContent="-";
return;
}
}
anim=requestAnimationFrame(trLoop);
}
function trReset(){if(anim)cancelAnimationFrame(anim);trInit();}
trInit();
</script>
</body>
</html>
