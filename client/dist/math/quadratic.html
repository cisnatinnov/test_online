<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Quadratic Function</title>
<link rel="stylesheet" href="../style.css">
<style>
.qf-inputs{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr auto;gap:8px;align-items:center;margin:15px 0}
.qf-inputs input{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:16px;box-sizing:border-box;text-align:center}
.qf-inputs label{font-size:18px;font-weight:bold;color:#007BFF}
#qfCanvas{display:block;margin:15px auto;border:2px solid #444;border-radius:8px;background:#fff}
.qf-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.qf-card{background:#f8f9fa;padding:12px;border-radius:8px;border:1px solid #dee2e6}
.qf-card h4{margin:0 0 6px;font-size:13px;color:#666}
.qf-card p{margin:2px 0;font-size:14px}
.qf-steps{background:#f8f9fa;padding:15px;border-radius:8px;margin:15px 0;line-height:1.8;font-size:14px}
.qf-steps h4{margin:0 0 8px}
</style>
</head>
<body>
<div class="container" style="max-width:700px">
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="link-btn" onclick="location.href='../tools.html'">Back</button>
<button class="link-btn" onclick="location.href='../dashboard.html'">Dashboard</button>
</div>
<h2 style="text-align:center">Quadratic Function</h2>
<p style="text-align:center;color:#888;font-size:14px">f(x) = ax&sup2; + bx + c</p>
<div class="qf-inputs">
<label>f(x) =</label>
<input type="number" id="qfA" value="1" step="any">
<label>x&sup2; +</label>
<input type="number" id="qfB" value="-2" step="any">
<label>x +</label>
<input type="number" id="qfC" value="-3" step="any">
<button onclick="qfCalc()" style="padding:10px 18px">Graph</button>
</div>
<div class="qf-info" id="qfInfo"></div>
<canvas id="qfCanvas" width="650" height="450"></canvas>
<div class="qf-steps" id="qfSteps" style="display:none"></div>
</div>
<script>
function E(id){return document.getElementById(id);}
function qfCalc(){
const a=parseFloat(E("qfA").value)||0;
const b=parseFloat(E("qfB").value)||0;
const c=parseFloat(E("qfC").value)||0;
if(a===0){E("qfInfo").innerHTML='<div class="qf-card" style="grid-column:span 2"><h4>Not Quadratic</h4><p>a cannot be 0 (it becomes linear).</p></div>';return;}
const disc=b*b-4*a*c;
const vertexX=-b/(2*a);
const vertexY=a*vertexX*vertexX+b*vertexX+c;
const axisX=vertexX;
const yIntercept=c;
const x1=disc>0?(-b+Math.sqrt(disc))/(2*a):null;
const x2=disc>0?(-b-Math.sqrt(disc))/(2*a):null;
const xVertex=disc===0?-b/(2*a):null;
let rootsHTML="";
if(disc>0){rootsHTML=`<p><strong>Root 1:</strong> x = ${x1.toFixed(4)}</p><p><strong>Root 2:</strong> x = ${x2.toFixed(4)}</p>`;}
else if(disc===0){rootsHTML=`<p><strong>Double root:</strong> x = ${xVertex.toFixed(4)}</p>`;}
else{const realPart=(-b/(2*a)).toFixed(4);const imagPart=(Math.sqrt(-disc)/(2*a)).toFixed(4);rootsHTML=`<p><strong>Complex roots:</strong></p><p>x = ${realPart} + ${imagPart}i</p><p>x = ${realPart} - ${imagPart}i</p>`;}
E("qfInfo").innerHTML=`
<div class="qf-card"><h4>Vertex</h4><p>(${vertexX.toFixed(4)}, ${vertexY.toFixed(4)})</p></div>
<div class="qf-card"><h4>Axis of Symmetry</h4><p>x = ${axisX.toFixed(4)}</p></div>
<div class="qf-card"><h4>Discriminant</h4><p>&Delta; = ${disc.toFixed(4)} ${disc>0?"(2 real roots)":disc===0?"(1 double root)":"(complex roots)"}</p></div>
<div class="qf-card"><h4>Y-intercept</h4><p>(0, ${yIntercept})</p></div>
<div class="qf-card"><h4>Opens</h4><p>${a>0?"Upward (minimum)":"Downward (maximum)"}</p></div>
<div class="qf-card"><h4>Roots</h4>${rootsHTML}</div>`;
E("qfSteps").style.display="";
E("qfSteps").innerHTML=`<h4>Solution Steps</h4>
<p><strong>1.</strong> Standard form: f(x) = ${a}x&sup2; + ${b}x + ${c}</p>
<p><strong>2.</strong> Discriminant: &Delta; = b&sup2; - 4ac = (${b})&sup2; - 4(${a})(${c}) = ${b*b} - ${4*a*c} = <strong>${disc}</strong></p>
${disc>0?`<p><strong>3.</strong> x = (-b &plusmn; &radic;&Delta;) / 2a = (${-b} &plusmn; ${Math.sqrt(disc).toFixed(4)}) / ${2*a}</p>
<p><strong>4.</strong> x&#8321; = ${x1.toFixed(4)}, x&#8322; = ${x2.toFixed(4)}</p>`:disc===0?`<p><strong>3.</strong> x = -b / 2a = ${-b} / ${2*a} = ${xVertex.toFixed(4)}</p>`:`<p><strong>3.</strong> Complex roots: x = ${(-b/(2*a)).toFixed(4)} &plusmn; ${(Math.sqrt(-disc)/(2*a)).toFixed(4)}i</p>`}
<p><strong>Vertex:</strong> x = -b/(2a) = ${-b}/${2*a} = ${vertexX.toFixed(4)}, f(${vertexX.toFixed(4)}) = ${vertexY.toFixed(4)}</p>`;
drawGraph(a,b,c,vertexX,vertexY,x1,x2);
}
function drawGraph(a,b,c,vx,vy,x1,x2){
const canvas=E("qfCanvas"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
ctx.clearRect(0,0,W,H);
let xMin,xMax;
if(x1!==null&&x2!==null){const spread=Math.abs(x2-x1)*0.5||2;xMin=Math.min(x1,x2)-spread;xMax=Math.max(x1,x2)+spread;}
else{xMin=vx-5;xMax=vx+5;}
const samplePts=[];
for(let px=0;px<W;px++){
const x=xMin+(px/W)*(xMax-xMin);
const y=a*x*x+b*x+c;samplePts.push({px,y});
}
const ys=samplePts.map(p=>p.y);
let yMin=Math.min(...ys,-1);let yMax=Math.max(...ys,1);
const ySpan=yMax-yMin;if(ySpan<4){yMin-=2;yMax+=2;}
const pad=0.15*(yMax-yMin);yMin-=pad;yMax+=pad;
const toX=v=>((v-xMin)/(xMax-xMin))*W;
const toY=v=>H-((v-yMin)/(yMax-yMin))*H;
ctx.strokeStyle="#e0e0e0";ctx.lineWidth=1;
const y0=toY(0);if(y0>0&&y0<H){ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();}
const x0=toX(0);if(x0>0&&x0<W){ctx.beginPath();ctx.moveTo(x0,0);ctx.lineTo(x0,H);ctx.stroke();}
ctx.fillStyle="#666";ctx.font="11px sans-serif";
const xStep=Math.ceil((xMax-xMin)/10);
for(let x=Math.ceil(xMin);x<=Math.floor(xMax);x+=xStep){
if(x===0)continue;
const px=toX(x);ctx.fillText(x,px+2,y0+14);
}
const yStep=Math.ceil((yMax-yMin)/8);
for(let y=Math.ceil(yMin);y<=Math.floor(yMax);y+=yStep){
if(y===0)continue;
const py=toY(y);ctx.fillText(y,x0+5,py-3);
}
ctx.strokeStyle="#007BFF";ctx.lineWidth=3;ctx.beginPath();
let started=false;
for(let px=0;px<W;px++){
const x=xMin+(px/W)*(xMax-xMin);
const y=a*x*x+b*x+c;
const py=toY(y);
if(py<-100||py>H+100){started=false;continue;}
if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
}
ctx.stroke();
ctx.fillStyle="#e74c3c";
const vpx=toX(vx),vpy=toY(vy);
ctx.beginPath();ctx.arc(vpx,vpy,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle="#e74c3c";ctx.font="bold 12px sans-serif";
ctx.fillText("Vertex ("+vx.toFixed(2)+","+vy.toFixed(2)+")",vpx+10,vpy-10);
ctx.fillStyle="#2ecc71";
if(x1!==null){const px1=toX(x1);ctx.beginPath();ctx.arc(px1,y0,5,0,Math.PI*2);ctx.fill();}
if(x2!==null){const px2=toX(x2);ctx.beginPath();ctx.arc(px2,y0,5,0,Math.PI*2);ctx.fill();}
ctx.strokeStyle="#e74c3c44";ctx.lineWidth=2;ctx.setLineDash([5,5]);
ctx.beginPath();ctx.moveTo(vpx,0);ctx.lineTo(vpx,H);ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle="#888";ctx.font="13px sans-serif";ctx.textAlign="center";
ctx.fillText("f(x) = "+a+"x\u00B2 + "+b+"x + "+c,W/2,20);
}
qfCalc();
</script>
</body>
</html>
