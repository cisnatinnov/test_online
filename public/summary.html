<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Ringkasan - Cek IMT & Gula Darah</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; margin:20px 0; }
        .stat-card { background:#f8f9fa; padding:20px; border-radius:8px; text-align:center; border:1px solid #dee2e6; }
        .stat-card h3 { margin:0 0 5px; font-size:14px; color:#666; }
        .stat-card .value { font-size:32px; font-weight:bold; color:#007BFF; }
        .stat-card .value.green { color:#28a745; }
        .stat-card .value.red { color:#dc3545; }
    </style>
</head>
<body>
    <div class="container" style="max-width:600px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-btn" onclick="location.href='dashboard.html'" style="float: none;">Kembali ke Dashboard</button>
            <button class="link-btn" onclick="logout()" style="float: none;">Logout</button>
        </div>
        <h2>Ringkasan Data</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Pasien</h3>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h3>Total IMT</h3>
                <div class="value" id="stat-bmi">0</div>
            </div>
            <div class="stat-card">
                <h3>IMT Normal</h3>
                <div class="value green" id="stat-normal">0</div>
            </div>
            <div class="stat-card">
                <h3>Gula Tinggi</h3>
                <div class="value red" id="stat-highsugar">0</div>
            </div>
        </div>
    </div>

    <script>
        function getToken() { return localStorage.getItem('token'); }
        function authHeaders() { return { 'Authorization': 'Bearer ' + getToken() }; }
        function cekLogin() { if (!getToken()) window.location.href = 'login.html'; }
        cekLogin();
        function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'login.html'; }

        async function muatSummary() {
            const res = await fetch('/api/dashboard/summary', { headers: authHeaders() });
            const data = await res.json();
            document.getElementById('stat-total').textContent = data.totalPatients || 0;
            document.getElementById('stat-bmi').textContent = data.totalBmi || 0;
            document.getElementById('stat-normal').textContent = data.normalBmi || 0;
            document.getElementById('stat-highsugar').textContent = data.highSugar || 0;
        }
        muatSummary();
    </script>
</body>
</html>
