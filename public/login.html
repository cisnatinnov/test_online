<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Cek IMT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" id="username" required oninput="validateEmail(this.value)">
                <small id="email-error" style="color:red;display:none;"></small>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="display:flex;gap:5px;">
                    <input type="password" id="password" required style="flex:1;" oninput="updateProgress()">
                    <button type="button" onclick="togglePassword()" style="flex-shrink:0;">Show</button>
                </div>
                <div id="progress-bar" style="height:6px;background:#e0e0e0;border-radius:3px;margin-top:6px;overflow:hidden;">
                    <div id="progress-fill" style="height:100%;width:0%;border-radius:3px;transition:width .3s;"></div>
                </div>
                <small id="password-error" style="color:red;display:none;"></small>
            </div>
            <button type="button" onclick="prosesLogin()">Login</button>
            <p style="margin-top: 15px;">Belum punya akun? <a href="register.html">Daftar</a></p>
        </form>
        <p id="login-error" style="color: red; margin-top: 10px;"></p>
    </div>

    <script>
        function togglePassword() {
            const el = document.getElementById('password');
            const btn = event.target;
            if (el.type === 'password') {
                el.type = 'text';
                btn.textContent = 'Hide';
            } else {
                el.type = 'password';
                btn.textContent = 'Show';
            }
        }

        function validateEmail(val) {
            const errEl = document.getElementById('email-error');
            if (!val.includes('@')) { errEl.style.display = 'none'; return; }
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!regex.test(val)) {
                errEl.textContent = 'Format email tidak valid';
                errEl.style.display = 'block';
            } else {
                errEl.style.display = 'none';
            }
        }

        function updateProgress() {
            const pw = document.getElementById('password').value;
            const fill = document.getElementById('progress-fill');
            let score = 0;
            if (pw.length >= 8) score += 20;
            if (/[A-Z]/.test(pw)) score += 20;
            if (/[a-z]/.test(pw)) score += 20;
            if (/[0-9]/.test(pw)) score += 20;
            if (/[!@#$%^&*(),.?":{}|<>]/.test(pw)) score += 20;

            fill.style.width = score + '%';
            if (score < 40) fill.style.background = '#e74c3c';
            else if (score < 80) fill.style.background = '#f39c12';
            else fill.style.background = '#2ecc71';
        }

        function validatePassword(pw) {
            const errEl = document.getElementById('password-error');
            if (pw.length < 8) {
                errEl.textContent = 'Password minimal 8 karakter';
                errEl.style.display = 'block';
                return false;
            }
            if (!/[A-Z]/.test(pw)) {
                errEl.textContent = 'Password harus memiliki minimal 1 huruf kapital';
                errEl.style.display = 'block';
                return false;
            }
            if (!/[a-z]/.test(pw)) {
                errEl.textContent = 'Password harus memiliki minimal 1 huruf kecil';
                errEl.style.display = 'block';
                return false;
            }
            if (!/[0-9]/.test(pw)) {
                errEl.textContent = 'Password harus memiliki minimal 1 angka';
                errEl.style.display = 'block';
                return false;
            }
            if (!/[!@#$%^&*(),.?":{}|<>]/.test(pw)) {
                errEl.textContent = 'Password harus memiliki minimal 1 simbol';
                errEl.style.display = 'block';
                return false;
            }
            errEl.style.display = 'none';
            return true;
        }

        function prosesLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                return alert('Semua field harus diisi!');
            }

            if (username.includes('@')) {
                const errEl = document.getElementById('email-error');
                if (errEl.style.display === 'block') return;
            }

            if (!validatePassword(password)) return;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(json => {
                if (json.success) {
                    const data = json.data || {};
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        window.location.href = 'dashboard.html';
                    } else if (data.require2fa) {
                        localStorage.setItem('tempToken', data.tempToken);
                        localStorage.setItem('channels', JSON.stringify(data.channels));
                        window.location.href = 'verify-2fa.html';
                    }
                } else {
                    document.getElementById('login-error').innerText = json.error;
                }
            })
            .catch(err => {
                document.getElementById('login-error').innerText = 'Terjadi kesalahan';
            });
        }
    </script>
</body>
</html>
