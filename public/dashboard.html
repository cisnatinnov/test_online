<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cek IMT & Gula Darah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="screen-menu" class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-btn" onclick="location.href='list.html'">Lihat data lain</button>
            <button class="link-btn" onclick="location.href='summary.html'">Ringkasan</button>
            <button class="link-btn" onclick="location.href='tools.html'">Tools & Games</button>
            <button class="link-btn" onclick="logout()" style="float: none;">Logout</button>
        </div>
        <h2>Selamat datang, <span id="welcome-name"></span></h2>
        <div style="display:flex;gap:10px;margin-top:20px;">
            <button style="flex:1;padding:15px;" onclick="showForm('bmi')">Cek IMT (Berat Badan)</button>
            <button style="flex:1;padding:15px;" onclick="showForm('sugar')">Cek Gula Darah</button>
            <button style="flex:1;padding:15px;" onclick="showForm('vitals')">Cek Tanda Vital</button>
        </div>
    </div>

    <div id="screen-form-bmi" class="container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-btn" onclick="showMenu()">Kembali</button>
            <button class="link-btn" onclick="logout()" style="float: none;">Logout</button>
        </div>
        <h2>Cek IMT (Berat Badan)</h2>
        <div class="form-group">
            <label>Pilih Identitas</label>
            <select id="bmi-identity" onchange="onBmiIdentityChange()">
                <option value="">-- Pilih --</option>
            </select>
        </div>
        <div id="bmi-identity-info" style="display:none;margin-bottom:15px;padding:10px;background:#f5f5f5;border-radius:8px;">
            <p><strong>Nama:</strong> <span id="bmi-info-name"></span></p>
            <p><strong>NIK:</strong> <span id="bmi-info-nik"></span></p>
            <p><strong>Usia:</strong> <span id="bmi-info-age"></span> tahun</p>
            <p><strong>Tinggi:</strong> <span id="bmi-info-height"></span> cm</p>
        </div>
        <div class="form-group">
            <label>Berat Badan (kg)</label>
            <input type="number" id="bmi-weight" required>
        </div>
        <button type="button" onclick="prosesBmi()">HITUNG</button>
    </div>

    <div id="screen-form-sugar" class="container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-btn" onclick="showMenu()">Kembali</button>
            <button class="link-btn" onclick="logout()" style="float: none;">Logout</button>
        </div>
        <h2>Cek Gula Darah</h2>
        <div class="form-group">
            <label>Pilih Identitas</label>
            <select id="sugar-identity" onchange="onSugarIdentityChange()">
                <option value="">-- Pilih --</option>
            </select>
        </div>
        <div id="sugar-identity-info" style="display:none;margin-bottom:15px;padding:10px;background:#f5f5f5;border-radius:8px;">
            <p><strong>Nama:</strong> <span id="sugar-info-name"></span></p>
            <p><strong>Usia:</strong> <span id="sugar-info-age"></span> tahun</p>
        </div>
        <div class="form-group">
            <label>Kadar Gula (mg/dL)</label>
            <input type="number" id="sugar-value" min="0" required>
        </div>
        <button type="button" onclick="prosesSugar()">HITUNG</button>
    </div>

    <div id="screen-form-vitals" class="container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-btn" onclick="showMenu()">Kembali</button>
            <button class="link-btn" onclick="logout()" style="float: none;">Logout</button>
        </div>
        <h2>Cek Tanda Vital</h2>
        <div class="form-group">
            <label>Pilih Identitas</label>
            <select id="vitals-identity" onchange="onVitalsIdentityChange()">
                <option value="">-- Pilih --</option>
            </select>
        </div>
        <div id="vitals-identity-info" style="display:none;margin-bottom:15px;padding:10px;background:#f5f5f5;border-radius:8px;">
            <p><strong>Nama:</strong> <span id="vitals-info-name"></span></p>
            <p><strong>Usia:</strong> <span id="vitals-info-age"></span> tahun</p>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div class="form-group">
                <label>Tekanan Darah Sistolik (mmHg)</label>
                <input type="number" id="vs-systolic" min="0" placeholder="120">
            </div>
            <div class="form-group">
                <label>Tekanan Darah Diastolik (mmHg)</label>
                <input type="number" id="vs-diastolic" min="0" placeholder="80">
            </div>
            <div class="form-group">
                <label>Denyut Jantung (bpm)</label>
                <input type="number" id="vs-heartrate" min="0" placeholder="72">
            </div>
            <div class="form-group">
                <label>Suhu Tubuh (C)</label>
                <input type="number" id="vs-temp" min="0" step="0.1" placeholder="36.5">
            </div>
            <div class="form-group">
                <label>Saturasi Oksigen (%)</label>
                <input type="number" id="vs-spo2" min="0" max="100" placeholder="98">
            </div>
            <div class="form-group">
                <label>Frekuensi Pernapasan (/menit)</label>
                <input type="number" id="vs-resp" min="0" placeholder="16">
            </div>
        </div>
        <button type="button" onclick="prosesVitals()">SIMPAN</button>
    </div>

    <div id="screen-hasil" class="container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-btn" onclick="showMenu()">Kembali</button>
            <button class="link-btn" onclick="logout()" style="float: none;">Logout</button>
        </div>
        <h2 id="hasil-title">Hasil Penghitungan</h2>
        <p><strong>Nama:</strong> <span id="res-name"></span></p>
        <p><strong>Usia:</strong> <span id="res-age"></span> tahun</p>
        <p><strong>Alamat:</strong> <span id="res-address"></span></p>
        <p><strong>Tinggi Badan:</strong> <span id="res-height"></span> cm</p>
        <p><strong>Berat Badan:</strong> <span id="res-weight"></span> kg</p>
        <hr>
        <h3>Kesimpulan Skor IMT:</h3>
        <p id="res-kesimpulan" style="font-size: 1.2em; font-weight: bold; color: #007BFF;"></p>
        <p id="res-gula-status" class="sugar-badge"></p>
        <p id="res-gula-keterangan"></p>
        <div id="res-vitals" style="display:none;margin-top:15px;padding:15px;background:#f8f9fa;border-radius:8px;">
            <h3>Tanda Vital:</h3>
            <div id="res-vitals-list"></div>
        </div>
        <button onclick="showMenu()">Kembali</button>
    </div>

    <div id="screen-hasil-vitals" class="container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-btn" onclick="showMenu()">Kembali</button>
            <button class="link-btn" onclick="logout()" style="float: none;">Logout</button>
        </div>
        <h2 id="hasil-vitals-title">Hasil Tanda Vital</h2>
        <div id="hasil-vitals-content"></div>
        <button onclick="showMenu()">Kembali</button>
    </div>

    <script>
        let identitiesList = [];

        function getToken() {
            return localStorage.getItem('token');
        }

        function authHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            };
        }

        function cekLogin() {
            if (!getToken()) window.location.href = 'login.html';
        }
        cekLogin();

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('tempToken');
            localStorage.removeItem('channels');
            window.location.href = 'login.html';
        }

        function showAllScreens() {
            ['screen-menu', 'screen-form-bmi', 'screen-form-sugar', 'screen-form-vitals', 'screen-hasil', 'screen-hasil-vitals'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        function showMenu() {
            showAllScreens();
            document.getElementById('screen-menu').classList.remove('hidden');
        }

        function showForm(type) {
            showAllScreens();
            loadIdentities(() => {
                if (type === 'bmi') {
                    document.getElementById('screen-form-bmi').classList.remove('hidden');
                } else if (type === 'sugar') {
                    document.getElementById('screen-form-sugar').classList.remove('hidden');
                } else if (type === 'vitals') {
                    document.getElementById('screen-form-vitals').classList.remove('hidden');
                }
            });
        }

        async function loadIdentities(cb) {
            try {
                const res = await fetch('/api/identities', { headers: authHeaders() });
                const json = await res.json();
                if (json.success) {
                    identitiesList = json.data || [];
                } else {
                    if (res.status === 401 || res.status === 403) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                        return;
                    }
                    identitiesList = [];
                    alert('Gagal memuat data identitas: ' + (json.error || 'Unknown error'));
                }
            } catch (err) {
                identitiesList = [];
                alert('Terjadi kesalahan saat memuat data identitas');
            }
            populateSelect('bmi-identity');
            populateSelect('sugar-identity');
            populateSelect('vitals-identity');
            if (cb) cb();
        }

        function calculateAge(birthdate) {
            if (!birthdate) return null;
            const birth = new Date(birthdate);
            if (isNaN(birth.getTime())) return null;
            const today = new Date();
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        function populateSelect(selectId) {
            const select = document.getElementById(selectId);
            select.innerHTML = '<option value="">-- Pilih --</option>';
            if (identitiesList.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'Belum ada data identitas';
                opt.disabled = true;
                select.appendChild(opt);
            } else {
                identitiesList.forEach(i => {
                    const opt = document.createElement('option');
                    opt.value = i.id;
                    opt.textContent = i.name + (i.nik ? ' (NIK: ' + i.nik + ')' : '');
                    select.appendChild(opt);
                });
            }
            const infoId = selectId.replace('identity', 'identity-info');
            const infoDiv = document.getElementById(infoId);
            if (infoDiv) infoDiv.style.display = 'none';
        }

        function onBmiIdentityChange() {
            const id = document.getElementById('bmi-identity').value;
            const infoDiv = document.getElementById('bmi-identity-info');
            if (!id) { infoDiv.style.display = 'none'; return; }
            const identity = identitiesList.find(i => i.id == id);
            if (identity) {
                document.getElementById('bmi-info-name').innerText = identity.name || '-';
                document.getElementById('bmi-info-nik').innerText = identity.nik || '-';
                document.getElementById('bmi-info-age').innerText = calculateAge(identity.birthdate) ?? '-';
                document.getElementById('bmi-info-height').innerText = identity.height || '-';
                infoDiv.style.display = 'block';
            }
        }

        function onSugarIdentityChange() {
            const id = document.getElementById('sugar-identity').value;
            const infoDiv = document.getElementById('sugar-identity-info');
            if (!id) { infoDiv.style.display = 'none'; return; }
            const identity = identitiesList.find(i => i.id == id);
            if (identity) {
                document.getElementById('sugar-info-name').innerText = identity.name || '-';
                document.getElementById('sugar-info-age').innerText = calculateAge(identity.birthdate) ?? '-';
                infoDiv.style.display = 'block';
            }
        }

        function onVitalsIdentityChange() {
            const id = document.getElementById('vitals-identity').value;
            const infoDiv = document.getElementById('vitals-identity-info');
            if (!id) { infoDiv.style.display = 'none'; return; }
            const identity = identitiesList.find(i => i.id == id);
            if (identity) {
                document.getElementById('vitals-info-name').innerText = identity.name || '-';
                document.getElementById('vitals-info-age').innerText = calculateAge(identity.birthdate) ?? '-';
                infoDiv.style.display = 'block';
            }
        }

        async function prosesVitals() {
            const identityId = document.getElementById('vitals-identity').value;
            if (!identityId) return alert('Pilih identitas!');

            const payload = { identity_id: Number(identityId) };
            const fields = { systolic: 'vs-systolic', diastolic: 'vs-diastolic', heart_rate: 'vs-heartrate', temperature: 'vs-temp', spo2: 'vs-spo2', respiratory_rate: 'vs-resp' };
            let hasAny = false;
            for (const [key, elId] of Object.entries(fields)) {
                const val = document.getElementById(elId).value;
                if (val !== '') { payload[key] = Number(val); hasAny = true; }
            }
            if (!hasAny) return alert('Isi minimal satu tanda vital!');

            try {
                const res = await fetch('/api/vital-signs', { method: 'POST', headers: authHeaders(), body: JSON.stringify(payload) });
                const saved = await res.json();
                if (!saved.success) return alert(saved.error || 'Gagal menyimpan');

                showAllScreens();
                document.getElementById('screen-hasil-vitals').classList.remove('hidden');
                document.getElementById('hasil-vitals-title').innerText = 'Tanda Vital - ' + (saved.data.name || '');

                const vs = saved.data.vitalSigns;
                const ev = saved.data.evaluation;
                let html = '<div style="padding:10px;background:#f5f5f5;border-radius:8px;">';
                html += '<p><strong>Pasien:</strong> ' + saved.data.name + '</p>';
                html += '<p><strong>Usia:</strong> ' + (saved.data.age ?? '-') + ' tahun</p><hr>';
                const labels = { systolic: 'Sistolik', diastolic: 'Diastolik', heart_rate: 'Denyut Jantung', temperature: 'Suhu', spo2: 'SpO2', respiratory_rate: 'Pernapasan' };
                const units = { systolic: 'mmHg', diastolic: 'mmHg', heart_rate: 'bpm', temperature: 'C', spo2: '%', respiratory_rate: '/menit' };
                for (const [key, label] of Object.entries(labels)) {
                    if (vs[key] != null) {
                        const evalData = ev[key === 'heart_rate' ? 'heartRate' : key === 'spo2' ? 'spo2' : key === 'respiratory_rate' ? 'respiratoryRate' : key === 'temperature' ? 'temperature' : 'bloodPressure'];
                        const badge = evalData ? '<span style="color:' + (evalData.colorClass === 'sugar-normal' ? '#28a745' : evalData.colorClass === 'sugar-low' ? '#007bff' : '#dc3545') + ';font-weight:bold"> (' + evalData.label + ')</span>' : '';
                        html += '<p><strong>' + label + ':</strong> ' + vs[key] + ' ' + units[key] + badge + '</p>';
                        if (evalData) html += '<p style="font-size:13px;color:#666;margin:-5px 0 8px 0">' + evalData.description + '</p>';
                    }
                }
                html += '<p style="margin-top:10px;font-weight:bold;color:' + (ev.overall === 'Semua normal' ? '#28a745' : '#dc3545') + '">' + ev.overall + '</p>';
                html += '</div>';
                document.getElementById('hasil-vitals-content').innerHTML = html;
            } catch (err) {
                alert('Terjadi kesalahan saat menyimpan tanda vital');
            }
        }

        async function prosesBmi() {
            const identityId = document.getElementById('bmi-identity').value;
            const weight = document.getElementById('bmi-weight').value;

            if (!identityId || !weight) {
                return alert('Pilih identitas dan isi berat badan!');
            }

            try {
                const res = await fetch('/api/bmi', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ identity_id: Number(identityId), weight: Number(weight) })
                });
                const saved = await res.json();
                if (!saved.success) return alert(saved.error || 'Gagal menyimpan');
                tampilkanHasil(saved.data);
            } catch (err) {
                alert('Terjadi kesalahan saat menghitung IMT');
            }
        }

        async function prosesSugar() {
            const identityId = document.getElementById('sugar-identity').value;
            const sugar = document.getElementById('sugar-value').value;

            if (!identityId || !sugar) {
                return alert('Pilih identitas dan isi kadar gula!');
            }

            try {
                const res = await fetch('/api/bloodsugar', {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ identity_id: Number(identityId), sugar: Number(sugar) })
                });
                const saved = await res.json();
                if (!saved.success) return alert(saved.error || 'Gagal menyimpan');
                tampilkanHasil(saved.data);
            } catch (err) {
                alert('Terjadi kesalahan saat menghitung gula darah');
            }
        }

        function tampilkanHasil(data) {
            if (!data) return;

            showAllScreens();
            document.getElementById('screen-hasil').classList.remove('hidden');

            document.getElementById('hasil-title').innerText = 'Hasil penghitungan ' + (data.name || '');
            document.getElementById('res-name').innerText = data.name || '-';
            document.getElementById('res-age').innerText = data.age ?? '-';
            document.getElementById('res-address').innerText = data.address || '-';
            document.getElementById('res-height').innerText = data.height || '-';
            document.getElementById('res-weight').innerText = data.weight || '-';
            document.getElementById('res-kesimpulan').innerText = data.weight ? 'Kategori BMI: ' + (data.result || '-') + ' (Skor: ' + (data.bmi || '-') + ')' : 'Belum ada data IMT';
            tampilkanKriteriaGula(data);
        }

        function tampilkanKriteriaGula(data) {
            const gula = data?.sugarCriteria || null;
            const container = document.getElementById('res-gula-status');
            const detail = document.getElementById('res-gula-keterangan');

            if (!gula) {
                container.innerText = '';
                detail.innerText = '';
                return;
            }

            container.innerText = 'Kriteria Gula: ' + gula.label;
            container.className = 'sugar-badge ' + gula.colorClass;
            detail.innerText = gula.description;
        }

        (function init() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('welcome-name').innerText = user.username || user.email || '';
        })();
    </script>
</body>
</html>
