<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Riwayat - Cek IMT & Gula Darah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="link-btn" onclick="location.href='list.html'" style="float: none;">Kembali ke Daftar</button>
            <button class="link-btn" onclick="logout()" style="float: none;">Logout</button>
        </div>
        <h2>Riwayat Pasien</h2>
        <p><strong>Nama:</strong> <span id="hist-name"></span></p>
        <p><strong>Nomor HP:</strong> <span id="hist-phone"></span></p>

        <h3>Riwayat IMT</h3>
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Berat (kg)</th>
                    <th>Usia</th>
                    <th>Hasil</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="hist-bmi"></tbody>
        </table>

        <h3 style="margin-top:20px;">Riwayat Gula Darah</h3>
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Usia</th>
                    <th>Hasil</th>
                    <th>Kesimpulan</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="hist-sugar"></tbody>
        </table>
    </div>

    <script>
        function getToken() { return localStorage.getItem('token'); }
        function authHeaders() { return { 'Authorization': 'Bearer ' + getToken() }; }
        function cekLogin() { if (!getToken()) window.location.href = 'login.html'; }
        cekLogin();
        function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'login.html'; }

        const params = new URLSearchParams(window.location.search);
        const identityId = params.get('id');

        if (!identityId) {
            document.body.innerHTML = '<p style="padding:20px;">ID pasien tidak ditemukan. <a href="list.html">Kembali</a></p>';
        } else {
            muatRiwayat();
        }

        async function muatRiwayat() {
            const [bmiRes, sugarRes] = await Promise.all([
                fetch('/api/history/' + identityId + '/bmi', { headers: authHeaders() }),
                fetch('/api/history/' + identityId + '/bloodsugar', { headers: authHeaders() })
            ]);
            const bmiData = await bmiRes.json();
            const sugarData = await sugarRes.json();

            if (bmiData.length > 0) {
                document.getElementById('hist-name').textContent = bmiData[0].name || '-';
            }
            if (sugarData.length > 0) {
                document.getElementById('hist-name').textContent = sugarData[0].name || document.getElementById('hist-name').textContent;
            }

            const bmiTbody = document.getElementById('hist-bmi');
            bmiData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.created_at ? new Date(row.created_at).toLocaleDateString('id-ID') : '-'}</td>
                    <td>${row.weight || '-'}</td>
                    <td>${row.age || '-'}</td>
                    <td>${row.result || '-'}</td>
                    <td>${row.status || '-'}</td>`;
                bmiTbody.appendChild(tr);
            });

            const sugarTbody = document.getElementById('hist-sugar');
            sugarData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.created_at ? new Date(row.created_at).toLocaleDateString('id-ID') : '-'}</td>
                    <td>${row.age || '-'}</td>
                    <td>${row.result || '-'}</td>
                    <td>${row.conclusion || '-'}</td>
                    <td>${row.status || '-'}</td>`;
                sugarTbody.appendChild(tr);
            });

            if (bmiData.length === 0 && sugarData.length === 0) {
                document.querySelector('.container').innerHTML += '<p>Tidak ada riwayat untuk pasien ini.</p>';
            }
        }
    </script>
</body>
</html>
