<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Verifikasi 2FA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Verifikasi Dua Faktor</h2>

        <div class="form-group">
            <label>Pilih metode pengiriman kode</label>
            <div id="channel-options" style="display:flex;gap:15px;margin-top:5px;"></div>
        </div>

        <p id="info-kirim" style="margin-top:10px;"></p>

        <form id="f2faForm">
            <div class="form-group">
                <label>Kode 2FA</label>
                <input type="text" id="code" maxlength="6" required>
            </div>
            <button type="button" id="btnSend" onclick="kirimKode()">Kirim Kode</button>
            <button type="button" id="btnVerify" onclick="verifikasi()" style="display:none;">Verifikasi</button>
            <p id="f2fa-error" style="color: red; margin-top: 10px;"></p>
        </form>
    </div>

    <script>
        const tempToken = localStorage.getItem('tempToken');
        const channels = JSON.parse(localStorage.getItem('channels') || '["email"]');

        if (!tempToken) {
            window.location.href = 'login.html';
        }

        let selectedChannel = channels[0] || 'email';

        (function renderChannels() {
            const container = document.getElementById('channel-options');
            channels.forEach(ch => {
                const label = document.createElement('label');
                label.style.cssText = 'cursor:pointer;padding:8px 16px;border:2px solid #ccc;border-radius:8px;display:flex;align-items:center;gap:6px;';
                label.innerHTML = `<input type="radio" name="channel" value="${ch}" ${ch === selectedChannel ? 'checked' : ''} onchange="selectedChannel='${ch}'"> ${ch === 'email' ? '📧 Email' : '💬 WhatsApp'}`;
                if (ch === selectedChannel) label.style.borderColor = '#4CAF50';
                label.querySelector('input').addEventListener('change', function() {
                    document.querySelectorAll('#channel-options label').forEach(l => l.style.borderColor = '#ccc');
                    label.style.borderColor = '#4CAF50';
                    selectedChannel = this.value;
                });
                container.appendChild(label);
            });
        })();

        async function kirimKode() {
            document.getElementById('info-kirim').innerText = 'Mengirim kode...';
            document.getElementById('f2fa-error').innerText = '';
            document.getElementById('btnSend').disabled = true;

            const res = await fetch('/api/auth/send-2fa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tempToken, channel: selectedChannel })
            });
            const json = await res.json();
            const data = json.data || {};
            document.getElementById('btnSend').disabled = false;

            if (json.success) {
                if (data.channel === 'email') {
                    document.getElementById('info-kirim').innerHTML = 'Kode telah dikirim ke <strong>' + data.sentTo + '</strong>';
                } else if (data.channel === 'whatsapp') {
                    document.getElementById('info-kirim').innerHTML = 'Kode telah dikirim ke WhatsApp <strong>' + data.sentTo + '</strong>';
                } else {
                    document.getElementById('info-kirim').innerHTML = 'Mode development - Kode: <strong>' + data.code + '</strong>';
                }
                document.getElementById('btnVerify').style.display = '';
            } else {
                document.getElementById('info-kirim').innerText = '';
                document.getElementById('f2fa-error').innerText = 'Gagal mengirim kode: ' + json.error;
            }
        }

        async function verifikasi() {
            const code = document.getElementById('code').value;
            if (!code) return alert('Masukkan kode 2FA!');

            const res = await fetch('/api/auth/verify-2fa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tempToken, code })
            });
            const json = await res.json();
            const data = json.data || {};

            if (json.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.removeItem('tempToken');
                localStorage.removeItem('channels');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('f2fa-error').innerText = json.error;
            }
        }
    </script>
</body>
</html>
