<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar - Cek IMT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Daftar Akun Baru</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>No. WhatsApp (opsional, untuk 2FA)</label>
                <input type="tel" id="phone" placeholder="+628123456789">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="display:flex;gap:5px;">
                    <input type="password" id="password" required style="flex:1;" oninput="updateProgress()">
                    <button type="button" onclick="togglePassword()" style="flex-shrink:0;">Show</button>
                </div>
                <div id="progress-bar" style="height:6px;background:#e0e0e0;border-radius:3px;margin-top:6px;overflow:hidden;">
                    <div id="progress-fill" style="height:100%;width:0%;border-radius:3px;transition:width .3s;"></div>
                </div>
                <small id="password-hint" style="color:#666;">Min 8 chars, min 1 capital & 1 symbol</small>
                <small id="password-error" style="color:red;display:none;"></small>
            </div>

            <hr style="margin:15px 0;border:0;border-top:1px solid #eee;">

            <h3 style="margin-bottom:10px;">Data Diri</h3>
            <div class="form-group">
                <label>NIK</label>
                <input type="text" id="nik" maxlength="16">
            </div>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Tempat Lahir</label>
                <input type="text" id="birthplace">
            </div>
            <div class="form-group">
                <label>Tanggal Lahir</label>
                <input type="date" id="birthdate" required>
            </div>
            <div class="form-group">
                <label>Tinggi Badan (cm)</label>
                <input type="number" id="height" required>
            </div>
            <div class="form-group">
                <label>Alamat</label>
                <input type="text" id="address">
            </div>

            <button type="button" onclick="prosesDaftar()">Daftar</button>
            <p style="margin-top: 15px;">Sudah punya akun? <a href="login.html">Login</a></p>
        </form>
        <p id="register-error" style="color: red; margin-top: 10px;"></p>
    </div>

    <script>
        function togglePassword() {
            const el = document.getElementById('password');
            const btn = event.target;
            if (el.type === 'password') {
                el.type = 'text';
                btn.textContent = 'Hide';
            } else {
                el.type = 'password';
                btn.textContent = 'Show';
            }
        }

        function updateProgress() {
            const pw = document.getElementById('password').value;
            const fill = document.getElementById('progress-fill');
            let score = 0;
            if (pw.length >= 8) score += 33;
            if (/[A-Z]/.test(pw)) score += 34;
            if (/[!@#$%^&*(),.?":{}|<>]/.test(pw)) score += 33;

            fill.style.width = score + '%';
            if (score < 34) fill.style.background = '#e74c3c';
            else if (score < 67) fill.style.background = '#f39c12';
            else fill.style.background = '#2ecc71';
        }

        function validatePassword(pw) {
            const errEl = document.getElementById('password-error');
            if (pw.length < 8) {
                errEl.textContent = 'Password minimal 8 karakter';
                errEl.style.display = 'block';
                return false;
            }
            if (!/[A-Z]/.test(pw)) {
                errEl.textContent = 'Password harus memiliki minimal 1 huruf kapital';
                errEl.style.display = 'block';
                return false;
            }
            if (!/[!@#$%^&*(),.?":{}|<>]/.test(pw)) {
                errEl.textContent = 'Password harus memiliki minimal 1 simbol';
                errEl.style.display = 'block';
                return false;
            }
            errEl.style.display = 'none';
            return true;
        }

        function prosesDaftar() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const nik = document.getElementById('nik').value;
            const name = document.getElementById('name').value;
            const birthplace = document.getElementById('birthplace').value;
            const birthdate = document.getElementById('birthdate').value;
            const height = document.getElementById('height').value;
            const address = document.getElementById('address').value;

            if (!username || !email || !password || !name || !birthdate || !height) {
                return alert('Semua field wajib harus diisi!');
            }

            if (!validatePassword(password)) return;

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username, email, password,
                    phone: phone || undefined,
                    nik: nik || undefined,
                    name,
                    birthplace: birthplace || undefined,
                    birthdate,
                    height: height ? Number(height) : undefined,
                    address: address || undefined
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('register-error').innerText = data.error;
                }
            })
            .catch(err => {
                document.getElementById('register-error').innerText = 'Terjadi kesalahan';
            });
        }
    </script>
</body>
</html>
